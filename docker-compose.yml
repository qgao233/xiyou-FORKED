# ============================================================
# 小轩西游 Docker Compose 编排文件
# 包含：PHP 5.6 Web 服务 + MySQL 5.7 数据库
# ============================================================
version: '3.8'

services:
  # --------------------------------------------------------
  # Web 服务：PHP 5.6 + Apache
  # --------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiyou-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # 数据库连接配置
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - MYSQL_DB_XXJY=${MYSQL_DB_XXJY:-xxjyuser}
      - MYSQL_DB_XYY=${MYSQL_DB_XYY:-xyy}
      # 站点配置
      - SITE_HOST=${SITE_HOST:-localhost}
    volumes:
      # 持久化游戏数据（INI 文件存档）
      - game-data:/var/www/html/ache
      - game-data-fqxy:/var/www/html/fqxy/ache
      # 挂载配置文件（可选，方便修改）
      # - ./config/config.php:/var/www/html/config/config.php
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xiyou-network

  # --------------------------------------------------------
  # 数据库服务：MySQL 5.7
  # --------------------------------------------------------
  db:
    image: hub.rat.dev/library/mysql:5.7
    container_name: xiyou-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DB_XXJY:-xxjyuser}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      # 持久化数据库数据
      - mysql-data:/var/lib/mysql
      # 初始化脚本（首次启动时自动执行）
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - xiyou-network

# --------------------------------------------------------
# 数据卷
# --------------------------------------------------------
volumes:
  mysql-data:
    driver: local
  game-data:
    driver: local
  game-data-fqxy:
    driver: local

# --------------------------------------------------------
# 网络
# --------------------------------------------------------
networks:
  xiyou-network:
    driver: bridge
